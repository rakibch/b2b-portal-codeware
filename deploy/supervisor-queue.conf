; /etc/supervisor/conf.d/b2b-portal-queue.conf
; Queued notifications (mail + database). Restarted by `php artisan queue:restart` on deploy.
[program:b2b-portal-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/b2b-portal/backend/artisan queue:work redis --queue=default --sleep=3 --tries=3 --backoff=30 --max-time=3600 --max-jobs=1000
directory=/var/www/b2b-portal/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/b2b-portal/backend/storage/logs/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
