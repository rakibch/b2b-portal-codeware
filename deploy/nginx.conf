# /etc/nginx/sites-available/b2b-portal
# SPA (frontend/dist) and API (Laravel /api) on ONE origin: no CORS, cookies/tokens never cross sites.

limit_req_zone $binary_remote_addr zone=api_burst:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.example.com;

    ssl_certificate     /etc/letsencrypt/live/portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 12m;            # KYC documents (5 MB) + multipart overhead

    # --- Security headers (SPA). The API adds its own in SecurityHeaders middleware. ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Strict CSP: no inline/eval scripts (limits XSS → bearer-token theft). Google Fonts allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Never serve dotfiles (.env, .git)
    location ~ /\.(?!well-known) { deny all; }

    # --- Laravel API ---
    location /api/ {
        limit_req zone=api_burst burst=60 nodelay;
        root /var/www/b2b-portal/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        root /var/www/b2b-portal/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Public product/category images (storage:link). Private KYC files are NOT under public/.
    location /storage/ {
        alias /var/www/b2b-portal/backend/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        location ~* \.(php|phtml|html|svg)$ { deny all; }
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/b2b-portal/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;            # PDF generation headroom
        internal;
    }

    location ~ \.php$ { return 404; }

    # --- Vue SPA ---
    root /var/www/b2b-portal/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
